<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f6f0e3">
  <title>내 영화 티어리스트</title>
  <style>
    :root {
      color-scheme: light;
      --paper: #f6f0e3;
      --surface: #fffcf5;
      --ink: #3e2d22;
      --muted: #6e5c4b;
      --line: #e2d6c3;
      --accent: #dfe7ac;
      --sans: "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
      font-family: var(--sans);
      color: var(--ink);
      background: var(--paper);
    }

    * { box-sizing: border-box; }
    body { margin: 0; }
    button { font: inherit; color: inherit; cursor: pointer; }
    button:focus-visible { outline: 3px solid #657339; outline-offset: 3px; }
    button:disabled { cursor: wait; opacity: .7; }
    h1, h2, h3, p { margin: 0; }
    svg { flex: none; }

    .page { width: min(1136px, 100% - 48px); margin: 0 auto; padding: 36px 0 48px; }
    .hero {
      position: relative;
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      align-items: center;
      gap: 24px;
      min-height: 205px;
      padding: 28px clamp(22px, 4.5vw, 50px);
      border: 1px solid #ded6b1;
      border-radius: 26px;
      background: linear-gradient(110deg, #fbf3dc 20%, #eef0cb 100%);
      overflow: hidden;
    }
    .eyebrow {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 14px;
      color: #545b35;
      font-size: .72rem;
      font-weight: 800;
      letter-spacing: .17em;
    }
    .eyebrow::before { content: ""; width: 20px; height: 1px; background: currentColor; }
    h1 { font-size: clamp(2rem, 5.4vw, 3.65rem); letter-spacing: -.07em; line-height: 1.12; }
    .hero p:last-child { margin-top: 12px; color: var(--muted); line-height: 1.55; }
    .hero-art { width: clamp(126px, 23vw, 228px); height: auto; }

    .board { margin-top: 28px; }
    .board-head, .tray-head {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 10px 20px;
    }
    .board-head { margin-bottom: 13px; }
    h2 { font-size: 1.2rem; letter-spacing: -.035em; }
    .actions { display: flex; flex-wrap: wrap; gap: 8px; }
    .action {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      min-height: 42px;
      padding: 0 13px;
      border: 1px solid var(--line);
      border-radius: 11px;
      background: var(--surface);
      font-size: .87rem;
      font-weight: 750;
    }
    .action:hover { background: #f2e9d7; }
    .action.primary { background: var(--accent); border-color: #bbc783; }
    .action.primary:hover { background: #d0dd92; }

    .tiers {
      padding: 7px;
      display: grid;
      gap: 7px;
      border: 1px solid var(--line);
      border-radius: 20px;
      background: #ece2d0;
    }
    .tier {
      display: grid;
      grid-template-columns: clamp(58px, 9vw, 100px) minmax(0, 1fr);
      min-height: 62px;
      border: 1px solid var(--line);
      border-radius: 13px;
      background: var(--surface);
    }
    .tier-label {
      display: grid;
      place-items: center;
      border-radius: 12px 0 0 12px;
      background: var(--tier-color);
      font: 700 2rem Georgia, serif;
    }
    .cards {
      display: flex;
      flex-wrap: wrap;
      align-items: flex-start;
      gap: 10px;
      padding: 10px;
    }
    .cards:empty::before {
      align-self: center;
      width: 100%;
      height: 1px;
      background: repeating-linear-gradient(90deg, #e8ddcb 0 4px, transparent 4px 9px);
      content: "";
      margin: 0 9px;
    }
    .movie {
      display: grid;
      gap: 6px;
      width: 106px;
      padding: 5px 5px 7px;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: #fffdf8;
      font-size: .75rem;
      font-weight: 750;
      line-height: 1.3;
      text-align: center;
      overflow-wrap: anywhere;
    }
    .movie:hover { border-color: #8d9b59; background: #f1f2d8; }
    .movie img { display: block; width: 100%; aspect-ratio: 2 / 3; object-fit: cover; border-radius: 6px; background: var(--paper); }

    .tray {
      margin-top: 16px;
      padding: 16px;
      border: 1px solid var(--line);
      border-radius: 17px;
      background: #fbf6ea;
    }
    .tray-title { display: flex; align-items: center; gap: 9px; }
    .count {
      padding: 3px 8px;
      border-radius: 20px;
      background: #ece2cf;
      font-size: .75rem;
      font-weight: 800;
    }
    .hint, .feedback { color: var(--muted); font-size: .86rem; line-height: 1.5; }
    .tray .cards { padding: 0; margin-top: 12px; }
    .tray .cards:empty { display: none; }
    .feedback { min-height: 1.5em; margin-top: 8px; }
    .feedback:empty { margin-top: 0; min-height: 0; }

    dialog {
      width: min(440px, 100% - 32px);
      padding: 22px;
      border: 1px solid var(--line);
      border-radius: 20px;
      color: var(--ink);
      background: var(--surface);
      box-shadow: 0 20px 70px #3e2d2233;
    }
    dialog::backdrop { background: #3e2d2266; }
    .dialog-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
    .dialog-head p { margin-top: 6px; }
    .choices { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 8px; margin-top: 18px; }
    .choice {
      min-height: 48px;
      border: 1px solid transparent;
      border-radius: 10px;
      background: var(--tier-color, #f2e9d7);
      font: 700 1.5rem Georgia, serif;
    }
    .choice:hover, .choice[aria-pressed="true"] { border-color: #78634d; }
    .choice:last-child { grid-column: 1 / -1; min-height: 40px; font: 750 .87rem var(--sans); }

    @media (max-width: 620px) {
      .page { width: calc(100% - 24px); padding-top: 12px; }
      .hero { min-height: 170px; border-radius: 19px; grid-template-columns: minmax(0, 1fr); padding: 22px 18px; }
      .hero > div { position: relative; z-index: 1; }
      .hero-art { position: absolute; right: -12px; top: -14px; width: 120px; opacity: .3; }
      .board { margin-top: 20px; }
      .tier-label { font-size: 1.65rem; }
      .tray { padding: 13px; }
    }
  </style>
</head>
<body>
  <main class="page">
    <header class="hero">
      <div>
        <p class="eyebrow">MELON CINEMA</p>
        <h1 id="page-title">내 영화 티어리스트</h1>
        <p>내가 본 영화 여덟 편을 취향대로 정리해 보세요.</p>
      </div>
      <svg class="hero-art" viewBox="0 0 244 156" aria-hidden="true">
        <defs>
          <pattern id="bun-crust" width="19" height="19" patternUnits="userSpaceOnUse" patternTransform="rotate(31)">
            <path d="M0 0H19V19" fill="none" stroke="#a28647" stroke-opacity=".52" stroke-width="2"/>
          </pattern>
          <linearGradient id="bun-fill" x2="0" y2="1">
            <stop stop-color="#f4dc92"/>
            <stop offset="1" stop-color="#d7ad63"/>
          </linearGradient>
        </defs>
        <ellipse cx="126" cy="132" rx="99" ry="10" fill="#7d7945" opacity=".14"/>
        <path d="M44 114c2-14 38-25 81-25 47 0 85 12 85 27-4 13-38 24-84 24-44 0-78-12-82-26Z" fill="#c5d18d" stroke="#78834e" stroke-width="2"/>
        <ellipse cx="127" cy="114" rx="68" ry="15" fill="#e5e9bc" stroke="#a3ad75"/>
        <path d="M60 106c-8-14-1-34 12-48 14-15 33-22 54-22 23 0 43 9 55 23 14 16 18 36 9 48-19 24-111 24-130-1Z" fill="url(#bun-fill)" stroke="#977242" stroke-width="2"/>
        <path d="M60 106c-8-14-1-34 12-48 14-15 33-22 54-22 23 0 43 9 55 23 14 16 18 36 9 48-19 24-111 24-130-1Z" fill="url(#bun-crust)"/>
        <path d="M73 86c4-13 19-25 34-30" fill="none" stroke="#fff0be" stroke-opacity=".8" stroke-linecap="round" stroke-width="3"/>
        <g fill="#77834a">
          <path d="M36 59c-1-10-3-12-12-13 9-1 11-4 12-13 1 9 4 12 13 13-9 1-12 3-13 13Z"/>
          <path d="M199 50c-1-8-3-10-10-11 7-1 9-3 10-11 1 8 3 10 10 11-7 1-9 3-10 11Z"/>
          <circle cx="218" cy="70" r="2.5"/>
          <circle cx="55" cy="25" r="2.5"/>
        </g>
      </svg>
    </header>

    <section class="board" aria-labelledby="board-title">
      <div class="board-head">
        <h2 id="board-title">등급표</h2>
        <div class="actions">
          <button class="action" id="reset" type="button">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 11a8 8 0 1 1 1.5 6.5M4 5v6h6"/></svg>
            초기화
          </button>
          <button class="action primary" id="save-png" type="button">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v12m-4-4 4 4 4-4M4 16v4h16v-4"/></svg>
            PNG로 저장
          </button>
        </div>
      </div>
      <div class="tiers" id="tiers"></div>
    </section>

    <section class="tray" aria-labelledby="tray-title">
      <div class="tray-head">
        <div class="tray-title">
          <h2 id="tray-title">미분류</h2>
          <span class="count" id="count"></span>
        </div>
        <p class="hint" id="tray-hint"></p>
      </div>
      <div class="cards" id="unranked"></div>
    </section>
    <p class="feedback" id="feedback" role="status"></p>
  </main>

  <dialog id="picker" aria-labelledby="picker-title" aria-describedby="picker-hint">
    <div class="dialog-head">
      <div>
        <h2 id="picker-title"></h2>
        <p class="hint" id="picker-hint">이 영화의 등급을 선택하세요.</p>
      </div>
      <form method="dialog"><button class="action">닫기</button></form>
    </div>
    <div class="choices" id="choices"></div>
  </dialog>

    ];

    const storageKey = 'codyssey-melon-cinema-b-v1';
    const feedback = document.querySelector('#feedback');
    const picker = document.querySelector('#picker');
    const pickerTitle = document.querySelector('#picker-title');
    const choices = document.querySelector('#choices');
    const unranked = document.querySelector('#unranked');
    const saveButton = document.querySelector('#save-png');
    const destinations = new Map([['', unranked]]);
    let selectedMovie;
    let rankings = readRankings();

    function readRankings() {
      try {
        const saved = JSON.parse(localStorage.getItem(storageKey));
        return Object.fromEntries(movies.map(({ id }) => {
          const tier = saved?.[id];
          return [id, tiers.some(({ label }) => label === tier) ? tier : ''];
        }));
      } catch {
        feedback.textContent = '저장된 배치를 불러올 수 없습니다.';
        return {};
      }
    }

    function persist(message) {
      try {
        localStorage.setItem(storageKey, JSON.stringify(rankings));
        feedback.textContent = message;
      } catch {
        feedback.textContent = message + ' 브라우저가 배치 저장을 허용하지 않아 이번에 연 화면에만 적용됩니다.';
      }
    }

    for (const { label, color } of tiers) {
      const row = document.createElement('section');
      const heading = document.createElement('h3');
      const cards = document.createElement('div');
      row.className = 'tier';
      row.style.setProperty('--tier-color', color);
      row.setAttribute('aria-labelledby', 'tier-' + label);
      heading.id = 'tier-' + label;
      heading.className = 'tier-label';
      heading.textContent = label;
      cards.className = 'cards';
      row.append(heading, cards);
      document.querySelector('#tiers').append(row);
      destinations.set(label, cards);
    }

    for (const { label, color } of [...tiers, { label: '', color: '#f2e9d7' }]) {
      const button = document.createElement('button');
      button.type = 'button';
      button.className = 'choice';
      button.value = label;
      button.style.setProperty('--tier-color', color);
      button.textContent = label || '미분류로 옮기기';
      choices.append(button);
      button.addEventListener('click', () => {
        rankings[selectedMovie.id] = label;
        render();
        persist(selectedMovie.title + (label ? ' → ' + label + ' 등급' : ' → 미분류'));
        picker.close();
        selectedMovie.card.focus();
      });
    }

    for (const movie of movies) {
      const card = document.createElement('button');
      const image = document.createElement('img');
      const title = document.createElement('span');
      card.type = 'button';
      card.className = 'movie';
      card.setAttribute('aria-haspopup', 'dialog');
      image.alt = '';
      image.src = movie.poster;
      title.textContent = movie.title;
      card.append(image, title);
      movie.card = card;
      movie.image = image;
      card.addEventListener('click', () => {
        selectedMovie = movie;
        pickerTitle.textContent = movie.title;
        for (const choice of choices.children) {
          choice.setAttribute('aria-pressed', String(choice.value === (rankings[movie.id] || '')));
        }
        picker.showModal();
      });
    }

    function render() {
      for (const cards of destinations.values()) cards.replaceChildren();
      for (const movie of movies) {
        destinations.get(rankings[movie.id] || '').append(movie.card);
      }
      const remaining = unranked.childElementCount;
      document.querySelector('#count').textContent = remaining + '편';
      document.querySelector('#tray-hint').textContent = remaining
        ? '카드를 눌러 등급을 골라 주세요.'
        : '여덟 편의 영화에 모두 등급을 매겼어요.';
    }

    document.querySelector('#reset').addEventListener('click', () => {
      rankings = {};
      render();
      persist('모든 영화를 미분류로 옮겼습니다.');
    });

    function roundedBox(ctx, color, x, y, width, height, radius) {
      ctx.fillStyle = color;
      ctx.beginPath();
      ctx.roundRect(x, y, width, height, radius);
      ctx.fill();
    }

    function drawPoster(ctx, movie, x, y) {
      const width = 104;
      const height = 150;
      const image = movie.image;
      const scale = Math.max(width / image.naturalWidth, height / image.naturalHeight);
      const sourceWidth = width / scale;
      const sourceHeight = height / scale;

      ctx.save();
      ctx.beginPath();
      ctx.roundRect(x, y, width, height, 6);
      ctx.clip();
      ctx.drawImage(image, (image.naturalWidth - sourceWidth) / 2,
        (image.naturalHeight - sourceHeight) / 2, sourceWidth, sourceHeight, x, y, width, height);
      ctx.restore();

      ctx.fillStyle = '#3e2d22';
      ctx.font = '700 14px ' + getComputedStyle(document.documentElement).getPropertyValue('--sans');
      ctx.textAlign = 'center';
      ctx.textBaseline = 'top';
      let line = '';
      let titleY = y + height + 8;
      for (const character of movie.title) {
        if (ctx.measureText(line + character).width > width) {
          ctx.fillText(line.trimEnd(), x + width / 2, titleY);
          titleY += 17;
          line = '';
        }
        if (line || character !== ' ') line += character;
      }
      ctx.fillText(line, x + width / 2, titleY);
    }

    async function makePng() {
      const groups = tiers.map(({ label }) => movies.filter(({ id }) => rankings[id] === label));
      await Promise.all(groups.flat().map(({ image }) => image.decode()));
      const rowHeights = groups.map(group => group.length ? 218 : 72);
      const width = 1080;
      const height = 154 + rowHeights.reduce((total, rowHeight) => total + rowHeight + 10, 0);
      const canvas = document.createElement('canvas');
      canvas.width = width * 2;
      canvas.height = height * 2;
      const ctx = canvas.getContext('2d');
      ctx.scale(2, 2);
      ctx.fillStyle = '#f6f0e3';
      ctx.fillRect(0, 0, width, height);
      roundedBox(ctx, '#e7ebbf', 28, 24, width - 56, 84, 18);
      ctx.fillStyle = '#3e2d22';
      ctx.font = '800 36px ' + getComputedStyle(document.documentElement).getPropertyValue('--sans');
      ctx.textBaseline = 'middle';
      ctx.fillText(document.querySelector('#page-title').textContent, 52, 66);

      let rowY = 126;
      tiers.forEach(({ label, color }, index) => {
        const rowHeight = rowHeights[index];
        roundedBox(ctx, '#fffcf5', 28, rowY, width - 56, rowHeight, 12);
        roundedBox(ctx, color, 36, rowY + 8, 78, rowHeight - 16, 9);
        ctx.font = 'bold 34px Georgia, serif';
        ctx.fillStyle = '#3e2d22';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(label, 75, rowY + rowHeight / 2);
        groups[index].forEach((movie, column) => {
          drawPoster(ctx, movie, 130 + column * 114, rowY + 12);
        });
        rowY += rowHeight + 10;
      });

      return new Promise((resolve, reject) => {
        canvas.toBlob(blob => blob ? resolve(blob) : reject(new Error('PNG 변환 실패')), 'image/png');
      });
    }

    saveButton.addEventListener('click', async () => {
      saveButton.disabled = true;
      try {
        const url = URL.createObjectURL(await makePng());
        const download = document.createElement('a');
        download.href = url;
        download.download = '내_영화_티어리스트.png';
        document.body.append(download);
        download.click();
        download.remove();
        setTimeout(() => URL.revokeObjectURL(url), 30000);
        feedback.textContent = 'PNG 다운로드를 요청했습니다.';
      } catch {
        feedback.textContent = 'PNG를 만들지 못했습니다. 다시 시도해 주세요.';
      } finally {
        saveButton.disabled = false;
      }
    });

    render();
  </script>
</body>
</html>

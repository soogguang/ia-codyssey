<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>내 영화 티어리스트</title>
<style>
  :root {
    --cream: #fbf4e4;
    --crumb: #fffaf0;
    --crust: #e9d8b4;
    --melon: #cfe39a;
    --melon-deep: #a9c66f;
    --cocoa: #5b3a24;
    --cocoa-soft: #8a6a52;
    --font: "Apple SD Gothic Neo", "Pretendard", "Noto Sans KR", "Malgun Gothic", sans-serif;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: var(--font);
    color: var(--cocoa);
    background-color: var(--cream);
    background-image: radial-gradient(rgba(169, 198, 111, .18) 1.5px, transparent 1.5px);
    background-size: 22px 22px;
    min-height: 100vh;
  }
  .wrap { max-width: 1040px; margin: 0 auto; padding: 28px 20px 60px; }

  header {
    position: relative;
    border-radius: 28px;
    padding: 26px 28px;
    background-color: var(--melon);
    background-image:
      repeating-linear-gradient(45deg, transparent 0 22px, rgba(255,255,255,.45) 22px 25px),
      repeating-linear-gradient(-45deg, transparent 0 22px, rgba(255,255,255,.45) 22px 25px);
    box-shadow: 0 6px 0 var(--melon-deep), 0 14px 30px rgba(91, 58, 36, .12);
    display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 16px;
  }
  h1 { margin: 0; font-size: 30px; letter-spacing: -0.5px; }
  .sub { margin: 6px 0 0; color: var(--cocoa-soft); font-size: 15px; }
  .actions { display: flex; gap: 10px; }
  .btn {
    font: inherit; font-size: 15px; font-weight: 700;
    border: none; border-radius: 999px; padding: 11px 20px; cursor: pointer;
    transition: transform .1s ease, box-shadow .1s ease;
  }
  .btn:active { transform: translateY(2px); }
  .btn:disabled { cursor: wait; opacity: .75; }
  .btn-main { background: var(--cocoa); color: var(--crumb); box-shadow: 0 3px 0 #3d2616; }
  .btn-sub { background: var(--crumb); color: var(--cocoa); box-shadow: 0 3px 0 var(--crust); }
  .btn:focus-visible, .card:focus-visible, .menu button:focus-visible { outline: 3px solid var(--cocoa); outline-offset: 2px; }
  #status { margin: 0; font-size: 14px; }
  #status:not(:empty) { margin-top: 16px; }

  .board {
    margin-top: 28px;
    background: var(--crumb);
    border: 3px solid var(--crust);
    border-radius: 26px;
    padding: 14px;
    display: flex; flex-direction: column; gap: 10px;
  }
  .row { display: flex; gap: 10px; min-height: 196px; }
  .label {
    flex: 0 0 96px;
    border-radius: 18px;
    display: flex; align-items: center; justify-content: center;
    font-size: 40px; font-weight: 800; color: var(--cocoa);
  }
  .items {
    flex: 1;
    min-width: 0;
    border-radius: 18px;
    background: #fdf1d8;
    padding: 12px;
    display: flex; flex-wrap: wrap; align-content: flex-start; align-items: flex-start; gap: 12px;
  }
  .empty { align-self: center; color: #c4ad8c; font-size: 14px; padding-left: 6px; }

  .pool-box {
    margin-top: 24px;
    border: 3px dashed var(--melon-deep);
    border-radius: 26px;
    padding: 16px 18px 20px;
    background: rgba(255, 250, 240, .7);
  }
  .pool-box h2 { margin: 0 0 12px; font-size: 18px; }
  .pool-box .items { background: transparent; padding: 0; min-height: 60px; }

  .card {
    width: 100px; padding: 0; border: none; background: none; cursor: pointer;
    font: inherit; color: var(--cocoa); text-align: center;
    display: flex; flex-direction: column; align-items: center; justify-content: flex-start;
    transition: transform .12s ease;
  }
  .card:hover { transform: translateY(-3px); }
  .card img {
    display: block; width: 100px; height: 144px; object-fit: cover;
    border-radius: 12px;
    box-shadow: 0 4px 10px rgba(91, 58, 36, .2);
  }
  .card span { display: block; margin-top: 6px; font-size: 12px; line-height: 1.3; word-break: keep-all; }
  .card.selected img { outline: 4px solid var(--cocoa); outline-offset: 2px; }

  .menu {
    position: absolute; z-index: 10;
    background: var(--crumb);
    border: 3px solid var(--crust);
    border-radius: 18px;
    padding: 10px;
    box-shadow: 0 10px 24px rgba(91, 58, 36, .22);
    display: none;
  }
  .menu.open { display: block; }
  .menu p { margin: 0 0 8px; font-size: 13px; color: var(--cocoa-soft); }
  .menu .grid { display: flex; gap: 6px; flex-wrap: wrap; max-width: 260px; }
  .menu button {
    font: inherit; font-weight: 800; font-size: 16px; color: var(--cocoa);
    border: none; border-radius: 12px; min-width: 42px; height: 42px; padding: 0 10px; cursor: pointer;
  }
  .menu button.pool-btn { font-size: 13px; background: #efe3c7; }
  .menu button[aria-current="true"] { box-shadow: inset 0 0 0 3px var(--cocoa); }

  @media (max-width: 600px) {
    .label { flex-basis: 56px; font-size: 28px; }
    h1 { font-size: 24px; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>내 영화 티어리스트</h1>
      <p class="sub">영화 카드를 누르고 등급을 골라 주세요.</p>
    </div>
    <div class="actions">
      <button class="btn btn-main" id="saveBtn" type="button">PNG로 저장</button>
      <button class="btn btn-sub" id="resetBtn" type="button">초기화</button>
    </div>
  </header>
  <p id="status" role="status"></p>

  <section class="board" id="board" aria-label="등급 칸"></section>

  <section class="pool-box">
    <h2>미분류</h2>
    <div class="items" id="pool"></div>
  </section>
</div>

<div class="menu" id="menu" role="dialog" aria-label="등급 선택">
  <p id="menuTitle"></p>
  <div class="grid" id="menuGrid"></div>
</div>

const TIERS = [
  { key: "S", color: "#f0a37a" },
  { key: "A", color: "#f5c96b" },
  { key: "B", color: "#c8dd8c" },
  { key: "C", color: "#a9d3b5" },
  { key: "F", color: "#c7a58c" }
];
const POOL = "none";
const STORAGE_KEY = "movie-tierlist-melon-v1";
const PAGE_TITLE = "내 영화 티어리스트";

let placement = loadPlacement();
let selectedId = null;

function loadPlacement() {
  try {
    const saved = JSON.parse(localStorage.getItem(STORAGE_KEY) || "{}");
    return (saved && typeof saved === "object") ? saved : {};
  } catch (e) { return {}; }
}
function savePlacement() {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(placement));
    statusMessage.textContent = "";
  } catch {
    statusMessage.textContent = "브라우저가 배치 저장을 허용하지 않아요. 파일을 다시 열면 변경 내용이 사라질 수 있어요.";
  }
}
function tierOf(id) {
  const t = placement[id];
  return TIERS.some(x => x.key === t) ? t : POOL;
}

const board = document.getElementById("board");
const pool = document.getElementById("pool");
const menu = document.getElementById("menu");
const menuGrid = document.getElementById("menuGrid");
const menuTitle = document.getElementById("menuTitle");
const statusMessage = document.getElementById("status");
const saveButton = document.getElementById("saveBtn");
const containers = {};

TIERS.forEach(t => {
  const row = document.createElement("div");
  row.className = "row";
  const label = document.createElement("div");
  label.className = "label";
  label.style.background = t.color;
  label.textContent = t.key;
  const items = document.createElement("div");
  items.className = "items";
  items.setAttribute("aria-label", t.key + " 등급");
  row.append(label, items);
  board.appendChild(row);
  containers[t.key] = items;
});
containers[POOL] = pool;

function makeCard(movie) {
  const btn = document.createElement("button");
  btn.type = "button";
  btn.className = "card";
  btn.dataset.id = movie.id;
  const img = document.createElement("img");
  img.src = movie.src;
  img.alt = "";
  const name = document.createElement("span");
  name.textContent = movie.title;
  btn.append(img, name);
  btn.addEventListener("click", e => { e.stopPropagation(); openMenu(movie.id, btn); });
  return btn;
}

function render() {
  Object.values(containers).forEach(c => c.innerHTML = "");
  MOVIES.forEach(m => containers[tierOf(m.id)].appendChild(makeCard(m)));
  TIERS.forEach(t => {
    if (!containers[t.key].children.length) {
      const hint = document.createElement("span");
      hint.className = "empty";
      hint.textContent = "아직 비어 있어요";
      containers[t.key].appendChild(hint);
    }
  });
  if (!pool.children.length) {
    const hint = document.createElement("span");
    hint.className = "empty";
    hint.textContent = "모든 영화의 등급을 정했어요!";
    pool.appendChild(hint);
  }
}

function openMenu(id, cardEl) {
  closeMenu();
  selectedId = id;
  cardEl.classList.add("selected");
  const movie = MOVIES.find(m => m.id === id);
  menuTitle.textContent = "'" + movie.title + "' 등급 고르기";
  menuGrid.innerHTML = "";
  const current = tierOf(id);
  TIERS.forEach(t => {
    const b = document.createElement("button");
    b.type = "button";
    b.textContent = t.key;
    b.style.background = t.color;
    if (current === t.key) b.setAttribute("aria-current", "true");
    b.addEventListener("click", () => moveTo(t.key));
    menuGrid.appendChild(b);
  });
  const back = document.createElement("button");
  back.type = "button";
  back.className = "pool-btn";
  back.textContent = "미분류로";
  if (current === POOL) back.setAttribute("aria-current", "true");
  back.addEventListener("click", () => moveTo(POOL));
  menuGrid.appendChild(back);

  menu.classList.add("open");
  const r = cardEl.getBoundingClientRect();
  const mw = menu.offsetWidth;
  let left = r.left + window.scrollX + r.width / 2 - mw / 2;
  left = Math.max(8, Math.min(left, window.scrollX + document.documentElement.clientWidth - mw - 8));
  menu.style.left = left + "px";
  const mh = menu.offsetHeight;
  const below = r.bottom + 8 + mh <= window.innerHeight;
  menu.style.top = (below ? r.bottom + window.scrollY + 8 : r.top + window.scrollY - mh - 8) + "px";
  menuGrid.querySelector("button").focus();
}

function closeMenu() {
  menu.classList.remove("open");
  document.querySelectorAll(".card.selected").forEach(c => c.classList.remove("selected"));
  selectedId = null;
}

function moveTo(tier) {
  if (!selectedId) return;
  const id = selectedId;
  if (tier === POOL) delete placement[id]; else placement[id] = tier;
  savePlacement();
  closeMenu();
  render();
  const moved = document.querySelector('.card[data-id="' + id + '"]');
  if (moved) moved.focus();
}

menu.addEventListener("click", e => e.stopPropagation());
document.addEventListener("click", closeMenu);
document.addEventListener("keydown", e => {
  if (e.key !== "Escape" || !selectedId) return;
  const selected = document.querySelector(".card.selected");
  closeMenu();
  selected?.focus();
});
window.addEventListener("resize", closeMenu);

document.getElementById("resetBtn").addEventListener("click", () => {
  placement = {};
  savePlacement();
  closeMenu();
  render();
});

/* ---------- PNG 저장 ---------- */
function roundRect(ctx, x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}
function wrapText(ctx, text, maxW) {
  const lines = [];
  let line = "";
  for (const word of text.split(" ")) {
    const test = line ? line + " " + word : word;
    if (ctx.measureText(test).width <= maxW || !line) { line = test; continue; }
    lines.push(line); line = word;
  }
  if (line) lines.push(line);
  return lines.slice(0, 2);
}
async function loadImg(movie) {
  const image = new Image();
  image.src = movie.src;
  await image.decode();
  return [movie.id, image];
}

async function exportPNG() {
  const FONT = getComputedStyle(document.body).fontFamily;
  const W = 1100, PAD = 36, TITLE_H = 110, LABEL_W = 100, GAP = 12;
  const CARD_W = 100, POSTER_H = 144, CARD_H = POSTER_H + 42, ROW_PAD = 14;
  const areaW = W - PAD * 2 - LABEL_W - GAP;
  const perLine = Math.max(1, Math.floor((areaW - ROW_PAD * 2 + GAP) / (CARD_W + GAP)));

  const rows = TIERS.map(t => {
    const list = MOVIES.filter(m => tierOf(m.id) === t.key);
    const lines = Math.max(1, Math.ceil(list.length / perLine));
    return { tier: t, list, h: lines * CARD_H + (lines - 1) * GAP + ROW_PAD * 2 };
  });
  const images = Object.fromEntries(await Promise.all(rows.flatMap(row => row.list.map(loadImg))));
  const H = PAD + TITLE_H + 20 + rows.reduce((s, r) => s + r.h + GAP, 0) - GAP + PAD;

  const scale = 2;
  const canvas = document.createElement("canvas");
  canvas.width = W * scale; canvas.height = H * scale;
  const ctx = canvas.getContext("2d");
  ctx.scale(scale, scale);

  ctx.fillStyle = "#fbf4e4";
  ctx.fillRect(0, 0, W, H);

  // 제목 띠 (메론빵 무늬)
  ctx.save();
  roundRect(ctx, PAD, PAD, W - PAD * 2, TITLE_H, 26);
  ctx.fillStyle = "#cfe39a"; ctx.fill(); ctx.clip();
  ctx.strokeStyle = "rgba(255,255,255,.5)"; ctx.lineWidth = 3;
  for (let x = -TITLE_H; x < W; x += 25) {
    ctx.beginPath(); ctx.moveTo(x, PAD); ctx.lineTo(x + TITLE_H, PAD + TITLE_H); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(x + TITLE_H, PAD); ctx.lineTo(x, PAD + TITLE_H); ctx.stroke();
  }
  ctx.restore();
  ctx.fillStyle = "#5b3a24";
  ctx.font = "800 40px " + FONT;
  ctx.textAlign = "center"; ctx.textBaseline = "middle";
  ctx.fillText(PAGE_TITLE, W / 2, PAD + TITLE_H / 2);

  let y = PAD + TITLE_H + 20;
  for (const r of rows) {
    roundRect(ctx, PAD, y, LABEL_W, r.h, 18);
    ctx.fillStyle = r.tier.color; ctx.fill();
    ctx.fillStyle = "#5b3a24";
    ctx.font = "800 44px " + FONT;
    ctx.textAlign = "center"; ctx.textBaseline = "middle";
    ctx.fillText(r.tier.key, PAD + LABEL_W / 2, y + r.h / 2);

    const ax = PAD + LABEL_W + GAP;
    roundRect(ctx, ax, y, areaW, r.h, 18);
    ctx.fillStyle = "#fdf1d8"; ctx.fill();

    r.list.forEach((m, i) => {
      const cx = ax + ROW_PAD + (i % perLine) * (CARD_W + GAP);
      const cy = y + ROW_PAD + Math.floor(i / perLine) * (CARD_H + GAP);
      const img = images[m.id];
      ctx.save();
      roundRect(ctx, cx, cy, CARD_W, POSTER_H, 12);
      ctx.clip();
      const s = Math.max(CARD_W / img.width, POSTER_H / img.height);
      const iw = img.width * s, ih = img.height * s;
      ctx.drawImage(img, cx + (CARD_W - iw) / 2, cy + (POSTER_H - ih) / 2, iw, ih);
      ctx.restore();
      ctx.fillStyle = "#5b3a24";
      ctx.font = "13px " + FONT;
      ctx.textAlign = "center"; ctx.textBaseline = "top";
      wrapText(ctx, m.title, CARD_W).forEach((ln, k) => ctx.fillText(ln, cx + CARD_W / 2, cy + POSTER_H + 6 + k * 16));
    });
    y += r.h + GAP;
  }

  const blob = await new Promise(resolve => canvas.toBlob(resolve, "image/png"));
  if (!blob) throw new Error("PNG encoding failed");

  const url = URL.createObjectURL(blob);
  const link = document.createElement("a");
  link.href = url;
  link.download = "내_영화_티어리스트.png";
  document.body.appendChild(link);
  link.click();
  link.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}

saveButton.addEventListener("click", async () => {
  saveButton.disabled = true;
  try {
    await exportPNG();
  } catch {
    statusMessage.textContent = "PNG를 저장하지 못했어요. 다시 시도해 주세요.";
  } finally {
    saveButton.disabled = false;
  }
});

render();
</script>
</body>
</html>

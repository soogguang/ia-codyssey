<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>월요병 진단서</title>
<style>
  :root {
    --bg: #f4f1ea;
    --paper: #fffdf8;
    --ink: #1f2a44;
    --muted: #5f677a;
    --line: #d9d4c7;
    --accent: #2f5aa8;
    --red: #d23c3c;
    --font: "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", system-ui, sans-serif;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--font); line-height: 1.55; }
  main { width: min(100% - 32px, 640px); margin: 32px auto 56px; }

  h1 { margin: 0; font-size: clamp(28px, 7vw, 38px); letter-spacing: -0.03em; }
  .lead { margin: 6px 0 24px; color: var(--muted); }

  .panel { background: var(--paper); border: 1px solid var(--line); border-radius: 16px; padding: 20px; }
  .panel + .panel { margin-top: 14px; }
  label.name-label { display: block; font-weight: 700; margin-bottom: 8px; }
  #name { width: 100%; padding: 12px 14px; font: inherit; border: 1.5px solid var(--line); border-radius: 10px; background: #fff; color: var(--ink); }
  #name:focus { outline: 2px solid var(--accent); border-color: var(--accent); }

  fieldset { border: 0; margin: 0; padding: 0; min-width: 0; }
  legend { font-weight: 700; margin-bottom: 10px; padding: 0; }
  .symptom {
    display: flex; gap: 12px; align-items: flex-start;
    padding: 12px; border-radius: 10px; cursor: pointer;
    border: 1px solid transparent;
  }
  .symptom:hover { background: #f3f5fb; }
  .symptom input { width: 20px; height: 20px; margin: 2px 0 0; flex-shrink: 0; accent-color: var(--accent); }
  .symptom:has(input:checked) { background: #eaf0fb; border-color: #c9d6f0; }
  .num { color: var(--muted); font-weight: 700; min-width: 1.6em; }
  .symptom span:last-child { word-break: keep-all; overflow-wrap: anywhere; }

  .btn {
    font: inherit; font-weight: 700; border-radius: 12px; padding: 13px 18px; cursor: pointer;
    border: 1.5px solid var(--ink);
  }
  .btn-main { background: var(--ink); color: #fff; width: 100%; margin-top: 16px; font-size: 17px; }
  .btn-sub { background: #fff; color: var(--ink); }
  .btn:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  #message { min-height: 1.5em; margin: 12px 0 0; color: var(--red); font-weight: 700; }

  #result { margin-top: 28px; }
  #result[hidden] { display: none; }
  .cert {
    position: relative; background: var(--paper); border: 2px solid var(--ink); border-radius: 6px;
    padding: 28px 24px 24px; box-shadow: 0 8px 24px rgba(31, 42, 68, .12);
  }
  .cert::before { content: ""; position: absolute; inset: 6px; border: 1px solid var(--line); border-radius: 3px; pointer-events: none; }
  .cert h2 { margin: 0 0 20px; text-align: center; font-size: 30px; letter-spacing: .5em; padding-left: .5em; }
  .cert dl { margin: 0; display: grid; grid-template-columns: 96px 1fr; border-top: 1px solid var(--ink); }
  .cert dt, .cert dd { margin: 0; padding: 10px 8px; border-bottom: 1px solid var(--line); }
  .cert dt { color: var(--muted); font-weight: 700; background: #f7f5ef; }
  .cert dd { font-weight: 700; overflow-wrap: anywhere; }
  .score { font-size: 32px; color: var(--red); line-height: 1.2; }
  .cert ul { margin: 0; padding-left: 1.1em; font-weight: 600; }
  .cert-foot { position: relative; margin-top: 22px; min-height: 104px; padding-right: 110px; }
  .cert-foot p { margin: 0; }
  .cert-foot .small { margin-top: 10px; font-size: 12px; color: var(--muted); }
  .stamp {
    position: absolute; right: 4px; bottom: 0; width: 96px; height: 96px; border-radius: 50%;
    border: 4px solid var(--red); color: var(--red); transform: rotate(-12deg);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    font-weight: 900; line-height: 1.15; text-align: center; opacity: .88;
  }
  .stamp b { font-size: 15px; }
  .stamp span { font-size: 18px; }
  .actions { display: flex; gap: 10px; margin-top: 16px; }
  .actions .btn { flex: 1; }
  .actions .btn-save { background: var(--accent); border-color: var(--accent); color: #fff; }

  @media (max-width: 420px) {
    .panel { padding: 16px; }
    .cert { padding: 22px 16px 18px; }
    .cert dl { grid-template-columns: 76px 1fr; }
    .cert h2 { font-size: 26px; }
    .actions { flex-direction: column; }
  }
</style>
</head>
<body>
<main>
  <h1>월요병 진단서</h1>
  <p class="lead">해당하는 증상을 모두 체크해 주세요.</p>

  <form id="form" novalidate>
    <div class="panel">
      <label class="name-label" for="name">환자 이름</label>
      <input id="name" type="text" maxlength="20" placeholder="이름을 입력해 주세요" autocomplete="off">
    </div>

    <div class="panel">
      <fieldset>
        <legend>증상 체크리스트</legend>
        <div id="symptoms"></div>
      </fieldset>
      <button class="btn btn-main" type="submit">진단하기</button>
      <p id="message" role="status"></p>
    </div>
  </form>

  <section id="result" hidden aria-label="진단 결과">
    <div class="cert" id="cert">
      <h2>진단서</h2>
      <dl>
        <dt>환자명</dt><dd id="r-name"></dd>
        <dt>발급일</dt><dd id="r-date"></dd>
        <dt>월요병 지수</dt><dd><span class="score" id="r-score"></span></dd>
        <dt>진단명</dt><dd id="r-diagnosis"></dd>
        <dt>처방</dt><dd><ul id="r-rx"></ul></dd>
      </dl>
      <div class="cert-foot">
        <p>위와 같이 진단합니다.</p>
        <p class="small">※ 재미로 보는 결과이며 실제 의학적 진단이 아닙니다.</p>
        <div class="stamp" aria-label="월요병 전문의 도장"><b>월요병</b><span>전문의</span></div>
      </div>
    </div>
    <div class="actions">
      <button class="btn btn-save" type="button" id="save">이미지로 저장</button>
      <button class="btn btn-sub" type="button" id="again">다시 진단하기</button>
    </div>
  </section>
</main>

<script>
  const SYMPTOMS = [
    { text: "일요일 밤 9시가 넘자 불안했다", score: 8 },
    { text: "월요일 아침 알람을 3번 이상 껐다", score: 10 },
    { text: "출근을 하다가 다시 집으로 돌아갈지 고민했다", score: 11 },
    { text: "아침에 깨서 병가를 낼지 말지 고민했다", score: 12 },
    { text: "오전 11시 전에 커피를 2샷 이상 마셨다", score: 10 },
    { text: "점심 메뉴 고민이 오늘 할 일보다 진지했다", score: 7 },
    { text: "달력을 열어 다음 공휴일까지 남은 날을 세어 봤다", score: 9 },
    { text: "메신저 답장을 '넵' 한 글자로만 보냈다", score: 5 },
    { text: "오후 3시에 끝나는 시간까지 남은 시간을 분 단위로 계산했다", score: 13 },
    { text: "거울 속 내 얼굴이 금요일보다 3살은 늙어 보였다", score: 15 }
  ];
  const STAGES = [
    { min: 0,  name: "월요병 음성 (아주 건강)", rx: ["넘치는 텐션을 동료에게 나눠 준다", "오늘 하루를 마음껏 즐긴다"] },
    { min: 20, name: "가벼운 월요 증후군", rx: ["점심 디저트 1개를 추가로 복용한다", "좋아하는 노래 3곡을 연속 재생한다"] },
    { min: 40, name: "중등도 월요병", rx: ["퇴근 후 치맥을 계획한다", "오후 3시에 초콜릿 한 조각을 섭취한다"] },
    { min: 60, name: "중증 월요병", rx: ["금요일 저녁 약속을 지금 바로 잡는다", "퇴근 후 이불 속에서 30분 절대 안정한다"] },
    { min: 80, name: "말기 월요병 (위독)", rx: ["다음 휴가 날짜를 달력에 크게 표시한다", "오늘은 무조건 일찍 잔다"] }
  ];

  const $ = id => document.getElementById(id);
  const list = $("symptoms");
  SYMPTOMS.forEach((s, i) => {
    const label = document.createElement("label");
    label.className = "symptom";
    const box = document.createElement("input");
    box.type = "checkbox";
    box.value = String(i);
    const num = document.createElement("span");
    num.className = "num";
    num.textContent = (i + 1) + ".";
    const text = document.createElement("span");
    text.textContent = s.text;
    label.append(box, num, text);
    list.append(label);
  });
  const boxes = [...list.querySelectorAll("input")];

  let current = null;

  function todayText() {
    const d = new Date();
    return d.getFullYear() + "년 " + (d.getMonth() + 1) + "월 " + d.getDate() + "일";
  }
  function stageOf(score) {
    return [...STAGES].reverse().find(s => score >= s.min);
  }

  $("form").addEventListener("submit", e => {
    e.preventDefault();
    const name = $("name").value.trim();
    if (!name) {
      $("result").hidden = true;
      current = null;
      $("message").textContent = "환자 이름을 입력해 주세요.";
      $("name").focus();
      return;
    }
    $("message").textContent = "";
    const score = boxes.reduce((sum, b) => sum + (b.checked ? SYMPTOMS[+b.value].score : 0), 0);
    const stage = stageOf(score);
    current = { name, date: todayText(), score, stage };

    $("r-name").textContent = name;
    $("r-date").textContent = current.date;
    $("r-score").textContent = score + "%";
    $("r-diagnosis").textContent = stage.name;
    $("r-rx").replaceChildren(...stage.rx.map(t => { const li = document.createElement("li"); li.textContent = t; return li; }));
    $("result").hidden = false;
    $("result").scrollIntoView({ behavior: "smooth", block: "start" });
  });

  $("again").addEventListener("click", () => {
    boxes.forEach(b => { b.checked = false; });
    $("result").hidden = true;
    $("message").textContent = "";
    current = null;
    window.scrollTo({ top: 0, behavior: "smooth" });
  });

  /* ---------- 이미지로 저장 ---------- */
  function wrap(ctx, text, maxW) {
    const lines = [];
    let line = "";
    for (const word of text.split(" ")) {
      const test = line ? line + " " + word : word;
      if (ctx.measureText(test).width <= maxW || !line) { line = test; }
      else { lines.push(line); line = word; }
    }
    if (line) lines.push(line);
    const out = [];
    for (const l of lines) {
      if (ctx.measureText(l).width <= maxW) { out.push(l); continue; }
      let part = "";
      for (const ch of l) {
        if (ctx.measureText(part + ch).width > maxW && part) { out.push(part); part = ""; }
        part += ch;
      }
      if (part) out.push(part);
    }
    return out;
  }

  function drawCert() {
    const W = 640, PAD = 40, LABEL_W = 120, LINE = 26;
    const FONT = getComputedStyle(document.body).fontFamily;
    const scale = 2;
    const tmp = document.createElement("canvas").getContext("2d");
    const valueW = W - PAD * 2 - LABEL_W - 24;

    tmp.font = "700 18px " + FONT;
    const nameLines = wrap(tmp, current.name, valueW);
    const diagLines = wrap(tmp, current.stage.name, valueW);
    tmp.font = "600 17px " + FONT;
    const rxLines = current.stage.rx.map(t => wrap(tmp, t, valueW - 18));

    const rows = [
      { label: "환자명", h: 20 + nameLines.length * LINE },
      { label: "발급일", h: 20 + LINE },
      { label: "월요병 지수", h: 64 },
      { label: "진단명", h: 20 + diagLines.length * LINE },
      { label: "처방", h: 20 + rxLines.reduce((n, l) => n + l.length, 0) * LINE + 6 }
    ];
    const tableTop = 130;
    const tableH = rows.reduce((s, r) => s + r.h, 0);
    const H = tableTop + tableH + 190;

    const canvas = document.createElement("canvas");
    canvas.width = W * scale; canvas.height = H * scale;
    const ctx = canvas.getContext("2d");
    ctx.scale(scale, scale);

    ctx.fillStyle = "#f4f1ea"; ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = "#fffdf8"; ctx.fillRect(20, 20, W - 40, H - 40);
    ctx.strokeStyle = "#1f2a44"; ctx.lineWidth = 2; ctx.strokeRect(20, 20, W - 40, H - 40);
    ctx.strokeStyle = "#d9d4c7"; ctx.lineWidth = 1; ctx.strokeRect(27, 27, W - 54, H - 54);

    ctx.fillStyle = "#1f2a44";
    ctx.textAlign = "center"; ctx.textBaseline = "middle";
    ctx.font = "800 34px " + FONT;
    ctx.fillText("진   단   서", W / 2, 78);

    let y = tableTop;
    ctx.strokeStyle = "#1f2a44"; ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.moveTo(PAD, y); ctx.lineTo(W - PAD, y); ctx.stroke();
    rows.forEach((r, i) => {
      ctx.fillStyle = "#f7f5ef"; ctx.fillRect(PAD, y, LABEL_W, r.h);
      ctx.fillStyle = "#5f677a"; ctx.font = "700 16px " + FONT;
      ctx.textAlign = "left"; ctx.textBaseline = "top";
      ctx.fillText(r.label, PAD + 12, y + 13);
      const vx = PAD + LABEL_W + 14;
      ctx.fillStyle = "#1f2a44";
      if (i === 0) { ctx.font = "700 18px " + FONT; nameLines.forEach((l, k) => ctx.fillText(l, vx, y + 11 + k * LINE)); }
      if (i === 1) { ctx.font = "700 18px " + FONT; ctx.fillText(current.date, vx, y + 11); }
      if (i === 2) { ctx.fillStyle = "#d23c3c"; ctx.font = "800 36px " + FONT; ctx.fillText(current.score + "%", vx, y + 12); }
      if (i === 3) { ctx.font = "700 18px " + FONT; diagLines.forEach((l, k) => ctx.fillText(l, vx, y + 11 + k * LINE)); }
      if (i === 4) {
        ctx.font = "600 17px " + FONT;
        let ly = y + 11;
        rxLines.forEach(lines => {
          lines.forEach((l, k) => {
            if (k === 0) ctx.fillText("•", vx, ly);
            ctx.fillText(l, vx + 18, ly);
            ly += LINE;
          });
        });
      }
      y += r.h;
      ctx.strokeStyle = "#d9d4c7"; ctx.lineWidth = 1;
      ctx.beginPath(); ctx.moveTo(PAD, y); ctx.lineTo(W - PAD, y); ctx.stroke();
    });

    ctx.fillStyle = "#1f2a44"; ctx.font = "600 17px " + FONT;
    ctx.textAlign = "left"; ctx.textBaseline = "top";
    ctx.fillText("위와 같이 진단합니다.", PAD, y + 34);
    ctx.fillStyle = "#5f677a"; ctx.font = "13px " + FONT;
    ctx.fillText("※ 재미로 보는 결과이며 실제 의학적 진단이 아닙니다.", PAD, y + 66);

    // 도장
    const cx = W - PAD - 58, cy = y + 80;
    ctx.save();
    ctx.translate(cx, cy); ctx.rotate(-12 * Math.PI / 180);
    ctx.globalAlpha = 0.88;
    ctx.strokeStyle = "#d23c3c"; ctx.lineWidth = 4;
    ctx.beginPath(); ctx.arc(0, 0, 50, 0, Math.PI * 2); ctx.stroke();
    ctx.fillStyle = "#d23c3c"; ctx.textAlign = "center"; ctx.textBaseline = "middle";
    ctx.font = "900 16px " + FONT; ctx.fillText("월요병", 0, -11);
    ctx.font = "900 19px " + FONT; ctx.fillText("전문의", 0, 13);
    ctx.restore();

    return canvas;
  }

  $("save").addEventListener("click", () => {
    if (!current) return;
    drawCert().toBlob(blob => {
      if (!blob) return;
      const a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = "월요병_진단서.png";
      document.body.append(a);
      a.click();
      a.remove();
      setTimeout(() => URL.revokeObjectURL(a.href), 30000);
    }, "image/png");
  });
</script>
</body>
</html>
